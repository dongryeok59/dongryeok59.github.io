습니다`,body:`불편이 들리면 현장부터 가겠습니다. 건물마다 직접 찾아가 문제를 찾고, 그 자리에서 공약을 시작하겠습니다.`},{key:`함께`,title:`만들겠습니다`,body:`단과대 학생회, 학생단체와 공약을 같이 만들고 같이 지키겠습니다. 흩어진 목소리를 하나로 모아 학교 앞에 세우겠습니다.`},{key:`끝까지`,title:`책임지겠습니다`,body:`전달하고 끝내지 않겠습니다. 학교의 답변과 이행 여부를 그대로 공개하고, 바뀔 때까지 다시 묻겠습니다.`}],candidates:[{role:`정후보`,name:`전호빈`,dept:`불교학부`,year:`24`,minor:`광고홍보학과 복수전공`,origin:`서울특별시 중구 출생`,photo:`photos/hobin-portrait.webp`,history:[{year:`2024`,items:[`청원고등학교 졸업`,`동국대학교 불교학부 입학(신입생 대표)`,`동국대학교 불교대학 학생회 ‘반딧불’ 기획국원`,`동국대학교 ROTC 66기 입단`]},{year:`2025`,items:[`동국대학교 제57대 총학생회 ‘동백’ 사무국원`,`동국대학교 중앙불교동아리 ‘동불’ 회장`,`동국대학교 영캠프 학생기획위원단 기획국장`,`동국대학교 가을 대동제 DIRVANA 축제기획단원`]},{year:`2026`,items:[`동국대학교 제58대 총학생회 비상대책위원회 ‘正’ 기획국장`,`동국대학교 불교학생회 ‘동불’ 회장`,`동국대학교 봄 대동제 DIRVANA 축제기획단원`,`동국대학교 가을 대동제 DIRVANA 축제기획단 안전관리부팀장`,`동국대학교 영캠프 학생기획위원단 부단장`,`동국대학교 생활협동조합 대의원`,`동국대학교 제4회 동국인 한마음 페스티벌 기획팀장`]}]},{role:`부후보`,name:`전채희`,dept:`광고홍보학과`,year:`25`,minor:`영어통번역전공 복수전공`,origin:`서울특별시 노원구 출생`,photo:`photos/chaehee-portrait.webp`,history:[{year:`2025`,items:[`창동고등학교 졸업`,`동국대학교 열린전공학부 1기 입학`,`동국대학교 열린전공학부 불교동아리 ‘무념무상’ 홍보부장`,`동국대학교 봄 대동제 DIRVANA 축제기획단 마케팅팀원`]},{year:`2026`,items:[`동국대학교 광고홍보학과 진학`,`동국대학교 사회과학대학 새내기 새로배움터 기획단원`,`동국대학교 제58대 총학생회 비상대책위원회 ‘正’ 홍보국원`,`동국대학교 봄 대동제 DIRVANA 축제기획단 홍보팀원`,`동국대학교 가을 대동제 DIRVANA 축제기획단 홍보팀원`,`동국대학교 생활협동조합 대의원`,`동국대학교 영캠프 학생기획위원단원`,`동국대학교 제4회 동국인 한마음 페스티벌 홍보팀장`]}]}],nameEn:`DONGRYEOK`,bookTitle:`동력 정책자료집`,officialSlogan:`동국을 움직이는 힘`,speech:{title:`출마소견`,paragraphs:[`존경하는 1만 3천 동국 학우 여러분, 제59대 총학생회 선거에 출마한 선거운동본부 ‘동력’의 정후보 전호빈, 부후보 전채희입니다. 먼저 함께 고민해 준 선본원들과, 늘 곁에서 목소리를 내주신 학우 여러분께 감사의 말씀 드립니다.`,`개교 120주년, 동국은 큰 갈림길에 서 있습니다. 캠퍼스에는 새 건물이 올라가고, 동국의 이름은 서울의 중심에서 뜨겁게 빛나고 있습니다. 그 변화를 만들어낸 것은 동국을 지켜온 우리의 애교심과 열정이었습니다.`,`그러나 학교의 중요한 결정 앞에서 학생의 자리는 비어 있었습니다. 비대위 체제 속에서도 우리의 노력은 빛났지만, 우리의 목소리는 결정의 자리까지 닿지 못했습니다. 여전히 누수와 노후화로 점철된 강의실에서 우리는 기본적인 학습권조차 보장받지 못하고 있습니다.`,`이제는 바뀌어야 합니다.`,`2024년부터 학생 사회의 최전선에서 배운 것은 단 하나입니다. 우리의 목소리는 하나의 뜻으로 모일 때, 학교를 움직이는 거대한 힘이 됩니다. ‘동력’은 우리의 움직임이 헛되지 않도록, 우리의 힘이 학교를 바꿀 수 있도록 결과로 증명하겠습니다.`,`자등명 법등명. 자신을 등불로 삼고, 진리를 등불로 삼아라. 누군가 대신 길을 밝혀 주기를 기다리지 말라는 120년 동국의 정신입니다.`,`우리가 이어 온 120년의 가치를, 이제는 우리 힘으로 지켜낼 때입니다. 우리의 목소리가 동국을 움직이는 힘이 되도록, 가장 앞에서 여러분의 ‘동력’이 되겠습니다.`,`감사합니다.`],sign:`동국대학교 제59대 총학생회 정기선거 정·부 후보자 전호빈, 전채희 드림`}},categories:[{id:`facility`,no:`I`,name:`시설을 바꾸는 힘`,short:`시설`,pledges:[{id:`lotus-council`,core:!0,title:`로터스관 협의체 마련 및 소음 실질적 해결책 구현`,blocks:[{type:`branches`,branches:[{id:`council`,label:`협의체`,steps:[{tag:`3월`,body:`학교에 층별 학생 공간(면적 및 용도) 계획 공개 요청, 입주 희망 단체 수요 조사`},{tag:`4월`,title:`협의체 출범`,body:`총학생회, 단과대 대표, 동아리 연합회, 입주 희망 단체, 학교 관계 부서. 학기마다 1회 이상 정례 회의 후 회의록 공개`},{tag:`임기 내`,body:`학생 공간 배정 기준안 문서화 후 총학생회에게 인계`}]},{id:`noise`,label:`소음`,steps:[{body:`인접 강의실 시간대별 소음 2주 실측 + 학생 설문`},{body:`중간·기말고사 기간 고소음 작업 시간대 조정 요구`},{body:`차음막 설치를 통한 소음 완화 요청`},{body:`공정 일정·소음 예고 매주 총학 채널 공지`}]}]},{type:`text`,title:`실행 및 예산 계획`,paragraphs:[`협의체 운영을 통하여 로터스관 이용에 학생들의 의견이 적극적으로 반영되게 하겠습니다. 방음 보강 및 공정 조정은 공사비 내 가설·안전 비용을 활용할 수 있도록 학교 측에 요청하겠습니다.`,`관련 비용은 학교와 시공사가 부담하도록 협의하여 학생들에게 추가적인 비용 부담이 발생하지 않도록 하겠습니다.`,`또한, 1학기 이내에 협의체를 출범시키고 정기적인 논의를 통해 공사로 인한 소음 문제를 해결하겠습니다.`,`회의록 공개 횟수를 통해 협의 과정의 투명성을 확보하고, 시험 기간 중 고소음 작업 건수를 공개하여 학생들이 공사 진행 상황과 소음 관리 현황을 확인할 수 있도록 하겠습니다.`]}]},{id:`facility-survey`,core:!0,title:`교내 시설 전수조사 및 방학 집중 수리`,blocks:[{type:`flow`,steps:[{title:`전수조사`,tag:`겨울방학, 12월 말~1월 초`,body:`단과대 학생회와 건물별 점검단 구성. 강의실·화장실·계단·실험실·과방을 사진·위치·날짜로 기록하고, 지난 학자요구안 미처리 건과 대조`},{title:`3단계 분류`,chips:[{t:`긴급`,body:`1학기 안에 수리 요청`},{t:`일반`,body:`여름방학 및 2학기 안에 수리 요청`},{t:`장기`,body:`2028년도 본예산`}]},{title:`공식 요구`,body:`학자요구안으로 일괄 제출, 항목별 처리 기한 회신`},{title:`이행 현황판`,body:`건물별 수리 전후 사진 매달 공개, 기한 넘긴 항목은 총장 간담회 안건`},{title:`방학 집중 수리`,body:`안전과 직결된 긴급 항목은 겨울방학 안에, 일반 항목은 여름방학에 고치도록 요구`}]},{type:`text`,title:`예산 계획`,paragraphs:[`당선 직후 1월 초부터 2월 말까지, 건물별 전수 조사 및 점검을 진행하겠습니다.`,`지난 세 학기 학자요구안 중 아직 처리되지 않은 항목도 함께 대조해, 1월 중순까지 긴급·일반·장기 목록을 완성하겠습니다.`,`긴급 항목은 최대한 빠르게 수리하도록 요구하고, 일반 항목은 1학기 안에 학교에 제출하여 1년 안에 수리를 요청하겠습니다. 또한 학생들이 수리 상황을 파악할 수 있도록 수리 전후 사진과 처리 상태를 매 학기 갱신하겠습니다.`,`사안이 심각한 항목은 총장 간담회 안건으로 올리고, 방수·배관처럼 큰 공사는 2028년 본예산에 반영하도록 요구하겠습니다. 점검과 현황판 운영은 총학생회가 직접 맡아 별도 비용 없이 진행하겠습니다.`]}]},{id:`law-restroom`,title:`법학관 화장실 누수 문제 개선`,promise:`누수 위치와 원인을 먼저 확인하고, 다시 새지 않도록 보수를 요청하겠습니다. 정문~팔정도 보행로 배수 등 법학관 일대의 불편도 함께 요구하겠습니다.`},{id:`culture-pest`,title:`학술문화관 지하 정기 방역`,promise:`지하 공간의 해충·곰팡이 실태를 예술대 학생회와 함께 조사하고, 분기마다 정기 방역이 이뤄지도록 요청하겠습니다.`},{id:`wonheung-leak`,title:`원흥관 누수 문제 개선`,promise:`공대 학생회와 누수 지점 지도를 만들어 원인 진단과 재발 방지 공사까지 요구하겠습니다.`},{id:`smoking-zone`,title:`흡연구역 전수조사 및 흡연부스 증설`,promise:`흡연구역 이용 현황을 전수조사해, 흡연자와 비흡연자 모두를 고려한 흡연부스 증설을 학교에 요청하겠습니다.`},{id:`rooftop-garden`,title:`혜화관 옥상정원 보수 및 개방`,promise:`안전 점검과 보수를 거쳐 봄 시즌 시범 개방부터 시작하고, 이용 규칙을 정해 학생들이 편하게 쉴 수 있는 공간으로 새롭게 구성하겠습니다.`},{id:`dorm`,title:`기숙사(남산학사) 복지시설 개선`,promise:`사생 설문으로 필요한 시설의 순위를 정하고, 전자레인지·정수기 같은 필수 품목부터 차례로 늘리겠습니다.`},{id:`wifi`,title:`교내 와이파이 정기 점검`,promise:`학생이 직접 잰 '와이파이 속도 지도'로 음영지역을 찾아 개선을 요청하겠습니다. 지난 학기 민원이 가장 많았던 문화관(53건)부터 시작해 학기마다 점검하겠습니다.`},{id:`desks`,title:`일체형 책상 교체 확대`,promise:`학교의 연차 교체 계획을 받아, 아직 바뀌지 않은 강의실 목록과 진행률을 학기마다 공개하겠습니다.`},{id:`lab`,title:`실험실 노후 기자재 및 시설 개선`,promise:`학과별 실험실습비 집행 내역을 통해 노후 기자재 교체에 먼저 쓰일 수 있도록 학생들이 안전하고 쾌적한 환경에서 실험할 수 있도록 하겠습니다.`},{id:`safe-route`,title:`캠퍼스맵 최신화 및 안전 이동 경로 추가`,promise:`엘리베이터·경사로·휠체어 경로와 미끄러운 계단을 담아 캠퍼스맵을 새로 만들고, 위험한 계단은 미끄럼 방지 시공을 요청하겠습니다.`},{id:`rest-space`,title:`휴게공간 없는 건물 줄이기`,promise:`학교에 비어 있는 공간들을 최대한 조사 및 활용해 학생들이 편히 쉴 수 있는 공간과 학습할 수 있는 공간으로 바꾸도록 요청하겠습니다.`},{id:`library-seat`,title:`도서관 좌석 예약·종료 편리화`,promise:`학교가 약속한 도서관 통합 앱의 좌석 예약·종료를 보다 간편화하고 헤이영캠퍼스와 연계 등 보다 편리한 환경에서 학습을 보장하겠습니다.`},{id:`lotus-noise`,core:!0,title:`로터스관 공사 소음에 대한 실질적 대책 마련`,ref:`lotus-council`,focus:`noise`,hidden:!0}],num:`01`},{id:`academic`,no:`II`,name:`배움을 넓히는 힘`,short:`배움`,pledges:[{id:`video-lecture`,core:!0,title:`영상강의 수강 인원 확대`,blocks:[{type:`flow`,steps:[{title:`수요 데이터 요청`,body:`직전 2개 학기 영상강의의 과목별 정원과 신청자, 대기 인원(장바구니) 자료를 받아 공개`},{title:`정원 증원 및 분반`,body:`대기 인원이 많은 과목부터 정원을 늘리거나 분반 개설 요구`},{title:`‘검토 예정’ 이행`,body:`학교가 검토하겠다고 한 사이버 강좌 확대의 과목 및 시기 이행`},{title:`교수 권리 보호안 함께 제시`,body:`다운로드 차단, 워터마크, 수강생 이용 동의로 영상 유출 우려 해소`},{title:`군 e러닝 연계`,body:`군 e러닝 학점 인정 과목 확대 요청(예비군 학습권 공약과 연결)`}]},{type:`text`,title:`예산 계획`,paragraphs:[`예산 부담을 최소화하면서 실질적인 정원 확대와 사이버 강좌 확충이 이루어질 수 있도록 기존 예산의 활용 가능성을 우선적으로 검토하겠습니다.`,`정원 증원에 따른 추가 비용은 최소화할 수 있도록 기존 강의 운영 체계를 활용하고, 채점 조교 확충에 대해서는 필요한 지원이 이루어질 수 있도록 학교 측에 요청하겠습니다.`,`또한, 신규 사이버 강좌 콘텐츠 제작에 필요한 비용은 교수학습 지원 예산을 활용하는 방안을 협의하겠습니다.`,`이와 함께 각 사업의 추진 과정에서 발생할 수 있는 추가 비용과 재정적 부담을 면밀히 검토하고, 필요한 경우 구체적인 소요 예산과 재원 확보 방안을 마련하여 학생들의 학습권 확대가 안정적으로 이루어질 수 있도록 노력하겠습니다.`]}]},{id:`summer-session`,core:!0,title:`계절학기 수요조사 및 반영`,blocks:[{type:`flow`,steps:[{title:`수요 조사`,body:`매 학기 말, 계절학기 수강신청 전에 과목별 희망 인원을 온라인으로 조사`},{title:`우선 과목 정리`,body:`선수과목처럼 놓치면 졸업이 1년 밀리는 과목부터 정리`},{title:`개설 요청`,body:`폐강 기준을 넘는 수요 근거와 함께 학과·다르마칼리지에 개설 요청`},{title:`결과 공개`,body:`요청 과목과 실제 개설 결과를 학기마다 공개`},{title:`정례화`,body:`매 학기 반복해 학과별 계절학기 개설 계획에 반영되도록 협의`}]},{type:`text`,title:`예상 우려`,paragraphs:[`학교는 교수와 강의실이 부족해 계절학기 증설이 어렵다고 답한 적이 있습니다.`,`그래서 모든 과목을 요구하지 않고, 수요가 확인된 과목과 1년을 기다려야 하는 선수과목부터 근거를 들고 요청하겠습니다.`,`특히 특정 단과대를 중심으로 선수과목 때문에 졸업이 밀리는 사례는 이미 학자요구안으로 올라와 있습니다.`]}]},{id:`general-ed`,title:`공통교양 분반·야간반 확대 요청`,promise:`수강신청 직후 공통교양 수강 실패 사례를 모아, 부족한 분반과 야간반을 늘리도록 요청하겠습니다.`},{id:`open-major`,title:`열린전공학부 TF팀 구성 및 연계 지원 확대`,promise:`열린전공 학생·진입 학과 대표·학사지원팀으로 TF를 만들고, 열린 전공 학생들 학교 적응 및 과 적응 최대한으로 돕겠습니다.`},{id:`industry`,title:`단과대별 업무 협약 체결 요청(계약학과 신설 등)`,promise:`단과대별 진로 수요를 모아 기업·기관 협약과 현장실습 자리를 늘리도록 요청하겠습니다. 계약학과 신설은 중장기 과제로 함께 요청하겠습니다.`},{id:`absolute-grading`,title:`필수 교양 절대평가 확대`,promise:`졸업 필수 교양 1~2개 과목부터 시범 적용을 요청하고, 성적 분포와 만족도를 공개해 확대 여부를 정하겠습니다.`},{id:`reserve`,title:`예비군 학습권 보장(군 e러닝 증설 등)`,promise:`훈련 날 불이익 최소화를 위해 수업 녹화 제공과 군 e러닝 학점 인정 확대를 요청하겠습니다. 나라를 지키는 소중한 의무가 훼손되지 않게 하겠습니다.`},{id:`exchange`,title:`교환학생 지원 확대 요청`,promise:`파견 대학 목록·학점 인정·장학 기준을 한곳에서 볼 수 있게 공개하고, 학생들의 교환학생 장벽을 낮추겠습니다.`},{id:`practicum`,title:`교생실습 결시자 학습권 보장`,promise:`교생실습 기간 대체 과제와 녹화 강의를 요청해 학업에 불이익이 없게 하겠습니다.`},{id:`exam-class`,title:`고시반 개선 및 증설 요청`,promise:`좌석 수와 대기 인원을 공개하고, 2021년 금액 그대로인 입반 장학의 현실화와 고시 휴학 인정을 요구하겠습니다.`}],num:`02`},{id:`connect`,no:`III`,name:`모두를 잇는 힘`,short:`모두`,pledges:[{id:`president-meeting`,core:!0,title:`총장·총학생회장 정기 간담회`,blocks:[{type:`flow`,loop:`매 학기 반복`,steps:[{title:`의제 수렴`},{title:`간담회`},{title:`이행 점검`},{title:`결과 공개`}]},{type:`text`,title:``,paragraphs:[`학교 당국과 학생 간의 지속적이고 실질적인 소통을 강화하기 위해 간담회를 학기당 1회(4~6월, 10~12월) 정례화하는 데 합의하고, 개최 2주 전부터 온라인 설문과 단과대 학생회 의견 수렴을 통해 체계적으로 우선순위 의제를 선정하며, 기존 요구안에 대한 학교 측 답변을 '완료·진행·미이행'으로 분류한 이행 현황표를 제출하여 내실 있는 논의를 진행하는 한편, 그 결과와 약속된 기한을 학생들에게 투명하게 공개하고 다음 간담회에서 최우선으로 점검하는 선순환 구조를 확립하고자 합니다.`,`만약 총장과의 면담이 이루어지지 않을 경우, 학자요구안을 통해 면담을 공식적으로 다시 요청할 계획입니다. 또한, 면담 진행 여부와 상관없이 요구사항에 대한 이행 현황표는 총학생회가 책임지고 학생들에게 투명하게 공개할 것입니다.`]}]},{id:`tuition`,core:!0,title:`등록금 동결 추진`,blocks:[{type:`flow`,steps:[{title:`TF·전체 설문`,tag:`1월`,body:`당선 직후 총학생회·단과대 회장단으로 등록금 TF를 꾸리고, 전체 학생 설문으로 협상 근거 확보`},{title:`작년 약속 점검`,body:`2026년 인상 때 약속된 조건(생성형 AI 무료 제공, 장학 확대, 법학관·학생회관 리모델링, 공감위원회)의 이행 여부 공개`},{title:`등심위 직접 협상`,body:`학생 위원으로 직접 참여해 동결을 1순위로 협상. 학교가 인상을 고수하면 사용처를 문서로 합의`},{title:`결과 공개·집행 점검`,body:`등심위 결과 공유 및 인상분 집행 내역은 추후에 다시 점검·공개`}]},{type:`text`,title:`실행 계획`,paragraphs:[`등록금 고지서의 숫자는 2년 연속 올랐습니다. 2025년 4.98%, 2026년 2.66%. 누군가에게 그 차이는 아르바이트 몇 주이고, 누군가에게는 크나큰 부담으로 다가옵니다.`,`2027년부터는 등록금을 동결한 대학에 국가장학금 Ⅱ유형을 연계해 주던 제도마저 사라집니다. 법정 인상 상한(약 2.6% 예상, 12월 교육부 공고) 안이라면 학교는 언제든 등록금을 올릴 수 있고, 동결할 이유는 줄어드는 첫해입니다.`,`그래서 이번에는 학생이 먼저 준비하겠습니다. 당선 직후 전체 학생 설문으로 우리의 목소리를 모으고, 지난 인상 때 약속된 조건이 지켜졌는지부터 확인하겠습니다. 그 근거를 들고 등록금심의위원회에 학생 위원으로 직접 들어가, 동결을 1순위로 협상하겠습니다. 결과는 24시간 안에 그대로 알리고, 인상분이 어디에 쓰였는지는 9월에 다시 확인하겠습니다.`,`우리가 낸 등록금이 우리를 위해 쓰일 때까지, 끝까지 묻겠습니다.`]}]},{id:`startup-fair`,title:`취업박람회 내 창업 부스 마련`,promise:`캠퍼스타운·창업 지원 기관·취업 부서와 함께 취업박람회에 창업 존을 열어, 창업과 진로 정보를 한자리에서 얻게 하겠습니다.`},{id:`delivery-zone`,title:`건물별 배달존 마련`,promise:`배달 수령이 몰리는 곳을 조사해 건물마다 수령 위치와 표지를 정하겠습니다. 배달 불편을 해소하겠습니다.`},{id:`rental`,title:`총학생회 대여물품 확대`,promise:`이용 기록과 설문으로 많이 찾는 물품부터 늘리고, 온라인 예약을 도입하겠습니다.`},{id:`sports`,title:`시즌별 스포츠 단체관람`,promise:`근처 경기장과 협업을 통해 스포츠 경기 단체 관람을 시즌마다 열고, 구단 단체 할인을 받겠습니다.`},{id:`gown`,title:`학위복 무료 대여`,promise:`총학생회실 학위복 무료 대여에 온라인 예약을 도입하고, 부족한 사이즈와 수량을 채우겠습니다.`},{id:`dept-room`,title:`과방 전수조사 및 확충`,promise:`과방 없는 학과를 조사하고, 학림관 지하처럼 방치된 공간부터 고쳐 연결하도록 요청하겠습니다.`},{id:`festival`,title:`축제 예산 확충 및 축제 활성화`,promise:`대동제 예산을 공개하고 후원·지역 연계로 재원을 넓혀 새 콘텐츠를 더하겠습니다. 축제가 끝나면 만족도 조사로 다음 축제를 준비하겠습니다.`},{id:`parking`,title:`주차 정기권 제휴`,promise:`교내 주차장 운영 업체의 재계약 시점(2027년 상반기)에 학생 정기권 할인을 넣도록 요구하겠습니다.`},{id:`snack`,title:`간식 행사 및 밤샘키트 지원`,promise:`중간·기말고사마다 생협·협찬과 함께 간식과 밤샘키트를 나누겠습니다.`},{id:`homecoming-bus`,title:`명절 귀향버스 및 예비군 버스 운영`,promise:`2026년 추석 귀향버스(3개 노선) 운영 경험으로 추석 귀향버스를 정례화하고, 예비군 훈련 날 버스를 운행하겠습니다.`},{id:`kakao`,title:`카톡 채널 활성화 및 오프라인 소통부스`,promise:`매주 소식이 오는 카톡 채널, 학기별 공약 이행 중간보고회를 운영하겠습니다.`},{id:`bmc`,title:`BMC TF팀 개설 및 소통 활성화`,promise:`BMC 학생 대표와 월 1회 TF를 열어, BMC에 없는 교양의 개설과 와이파이 개선 등 BMC 학생들이 보다 나은 환경에서 학교를 다닐 수 있게 하겠습니다.`},{id:`elephant-train`,title:`코끼리열차 시범 운영`,promise:`교내 순환 셔틀을 임차해 시범 운행하겠습니다. 교통약자 우선 탑승과 이용 데이터 공개로 정규 운행을 준비하겠습니다.`},{id:`toilet-check`,title:`교내외 화장실 불법촬영 점검`,promise:`학교 안 화장실은 학기 2회 점검하고, 학교 앞 상가 화장실은 관할 경찰서·구청과 합동으로 점검해 결과를 공개하겠습니다.`}],num:`03`}],aliases:{"reserve-bus":`homecoming-bus`},roadmap:{periods:[`당선 직후`,`3~4월`,`5~6월`,`7~8월`,`9~10월`,`11~12월`],rows:{facility:[[`2027 예산 심의대응`],[`[전수조사](facility-survey)`,`[로터스관 협의체 출범](lotus-council)`,`1학기 학자요구안`],[`[긴급 보수 착수](facility-survey)`,`[1차 총장 간담회](president-meeting)`],[`학교 답변 공개`,`미반영분 추경 요구`],[`2학기 학자요구안`,`[2차 총장 간담회](president-meeting)`],[`[2028 본예산 요구](facility-survey)`,`이행률 공개`]],academic:[[`당선 직후 학습권 TF`,`[2027 등록금 심의 대응](tuition)`],[`[영상강의/교양 현황 조사](video-lecture)`,`1학기 학자요구안`],[`[계절학기 수요조사](summer-session)`,`[1차 총장 간담회](president-meeting)`],[`[절대평가 시범 협의](absolute-grading)`,`학교 답변 공개`],[`시범 적용`,`[2차 총장 간담회](president-meeting)`],[`결과 공개`,`2028 확대 요구`]],connect:[[`[등록금 TF · 전체 설문](tuition)`,`[2027 등록금 심의 대응](tuitio
